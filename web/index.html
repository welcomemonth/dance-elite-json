<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>伴奏校对 | 国舞菁英2026全国少儿中国舞独舞冠军赛·10月超级赛</title>

  <!-- 页面基础信息 -->
  <meta
    name="description"
    content="全国少儿中国舞独舞冠军赛·10月超级赛，伴奏在线试听与校对"
  >

  <!-- 微信/QQ等平台分享信息 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="伴奏校对 | 国舞菁英2026全国少儿中国舞独舞冠军赛·10月超级赛">
  <meta property="og:description" content="全国少儿中国舞独舞冠军赛·10月超级赛，伴奏在线试听与校对">
  <meta property="og:site_name" content="国舞菁英2026">

  <!-- 必须是微信能够访问到的完整 HTTPS 地址 -->
  <meta property="og:url" content="https://dance.meetmonth.top/contest">
  <meta property="og:image" content="https://dance.meetmonth.top/cover.jpg">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 列表视图 -->
    <div id="list-view">
      <header class="cover">
        <img src="cover.jpg" alt="顶部图片">
      </header>

      <div class="search-bar">
        <input id="search-input" type="text" placeholder="搜索音频..." autocomplete="off" spellcheck="false">
      </div>

      <ul id="audio-list"></ul>

      <div id="list-count" class="list-count hidden"></div>

      <div id="list-loading" class="hint">加载中...</div>
      <div id="list-empty" class="hint hidden">暂无音频</div>
      <div id="list-no-match" class="hint hidden">暂无匹配</div>
      <div id="list-error" class="hint hidden">加载失败，请刷新重试</div>
    </div>

    <!-- 播放视图 -->
    <div id="player-view" class="hidden">
      <header class="cover">
        <img src="cover.jpg" alt="顶部图片">
      </header>

      <div class="player-body">
        <div id="player-title" class="song-name"></div>

        <audio id="audio" controls preload="metadata"></audio>

        <div id="player-error" class="hint hidden">音频播放失败</div>

        <button id="back-btn" type="button">← 返回列表</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
